name: Release Security Gate

on:
  push:
    tags:
      - "skill-*"

permissions:
  contents: read

jobs:
  security-gate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "24"

      - name: Run security gate
        run: node scripts/security-gate.mjs --root . --exceptions security/audit-exceptions.json

      - name: Run security gate self-test
        run: node scripts/security-gate-selftest.mjs

      - name: Validate standalone source guidance and command coverage
        run: |
          node scripts/standalone-guidance-selftest.mjs

      - name: Validate bare init worktree-default guidance
        run: |
          node scripts/bare-init-worktree-default-guidance-selftest.mjs

      - name: Validate unified switch-mode guidance
        run: node scripts/switch-mode-guidance-selftest.mjs

      - name: Validate explicit tmux launch guidance
        run: node scripts/tmux-launch-guidance-selftest.mjs

      - name: Validate managed Kitty session guidance
        run: |
          node scripts/kitty-session-guidance-selftest.mjs

      - name: Validate unified create-launch guidance
        run: node scripts/create-launch-guidance-selftest.mjs

      - name: Validate tab launch-disposition guidance
        run: node scripts/tab-launch-disposition-guidance-selftest.mjs

      - name: Validate CLI flag rationalization guidance
        run: node scripts/cli-flag-rationalization-guidance-selftest.mjs

  package-skill:
    runs-on: ubuntu-latest
    needs:
      - security-gate
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "24"

      - name: Create skill artifact
        run: tar -czf arashi-skill-package.tar.gz skills/ README.md LICENSE security/

      - name: Validate all packaged guidance
        run: |
          mkdir package-check
          tar -xzf arashi-skill-package.tar.gz -C package-check
          node scripts/standalone-guidance-selftest.mjs --skill-root package-check/skills/arashi
          node scripts/bare-init-worktree-default-guidance-selftest.mjs --skill-root package-check/skills/arashi
          node scripts/switch-mode-guidance-selftest.mjs --skill-root package-check/skills/arashi
          node scripts/create-launch-guidance-selftest.mjs --skill-root package-check/skills/arashi
          node scripts/tmux-launch-guidance-selftest.mjs --skill-root package-check/skills/arashi
          node scripts/kitty-session-guidance-selftest.mjs --skill-root package-check/skills/arashi
          node scripts/tab-launch-disposition-guidance-selftest.mjs --skill-root package-check/skills/arashi
          node scripts/cli-flag-rationalization-guidance-selftest.mjs --skill-root package-check/skills/arashi

      - name: Upload skill artifact
        uses: actions/upload-artifact@v7
        with:
          name: arashi-skill-package
          path: arashi-skill-package.tar.gz
