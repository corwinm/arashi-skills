name: Release Security Gate

on:
  push:
    tags:
      - "skill-*"

permissions:
  contents: read

jobs:
  security-gate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "24"

      - name: Run security gate
        run: node scripts/security-gate.mjs --root . --exceptions security/audit-exceptions.json

      - name: Run security gate self-test
        run: node scripts/security-gate-selftest.mjs

      - name: Test semantic guidance infrastructure
        run: |
          node scripts/guidance-registration-selftest.mjs
          node scripts/guidance-aggregate-selftest.mjs
          node scripts/release-archive-selftest.mjs

      - name: Validate authored guidance
        run: node scripts/validate-guidance.mjs

      - name: Create canonical skill artifact
        run: node scripts/create-release-archive.mjs --output arashi-skill-package.tar.gz

      - name: Extract canonical skill artifact
        run: |
          mkdir package-check
          tar -xzf arashi-skill-package.tar.gz -C package-check

      - name: Validate canonical packaged guidance
        run: node scripts/validate-guidance.mjs --skill-root package-check/skills/arashi

      - name: Test workflow composition
        run: node scripts/workflow-composition-selftest.mjs

      - name: Upload skill artifact
        uses: actions/upload-artifact@v7
        with:
          name: arashi-skill-package
          path: arashi-skill-package.tar.gz
